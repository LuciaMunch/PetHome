# ==========================================================================
#  Perfil de TEST — se activa con @ActiveProfiles("test")
#  Usa una base H2 en memoria: no se conecta a Neon ni a ningún servicio real,
#  así los tests corren en cualquier lado (y en el CI) sin credenciales.
# ==========================================================================

# Base de datos H2 en memoria, en modo de compatibilidad PostgreSQL
spring.datasource.url=jdbc:h2:mem:pethome_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate genera el esquema desde las entidades (en test NO usamos Flyway)
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Valores de relleno para que el contexto levante.
# No se conecta a nada: son solo para que los @Value no queden vacíos.
pethome.jwt.secret=clave-de-test-para-pethome-con-al-menos-32-caracteres
pethome.jwt.expiration-ms=86400000
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
