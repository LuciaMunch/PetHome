spring.application.name=pethome

# Base de datos (Neon)
spring.datasource.url=jdbc:postgresql://ep-icy-wind-ax1xammn-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

# HikariCP - evita conexiones "zombie" cuando Neon suspende el computo por inactividad
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=120000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (clave para firmar los tokens del login)
pethome.jwt.secret=${JWT_SECRET}
pethome.jwt.expiration-ms=86400000

# Cloudinary (almacenamiento de imágenes)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Límite de tamaño para subida de archivos (fotos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB