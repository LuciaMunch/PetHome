<div class="auth-container">
  <div class="card">
    <div class="header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 100 100">
          <circle cx="30" cy="25" r="12" fill="#58A787"/>
          <circle cx="50" cy="18" r="12" fill="#58A787"/>
          <circle cx="70" cy="25" r="12" fill="#58A787"/>
          <ellipse cx="50" cy="58" rx="24" ry="20" fill="#58A787"/>
        </svg>
      </div>
      <h1 class="app-name">PetHome</h1>
      <p class="subtitle">{{ modo === 'login' ? 'Bienvenido de vuelta' : 'Encontrá tu nuevo compañero' }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="nombre_usuario">Nombre de usuario</label>
        <input
          id="nombre_usuario"
          type="text"
          formControlName="nombre_usuario"
          placeholder="Tu nombre de usuario"
        />
      </div>

      @if (modo === 'registro') {
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tucorreo@ejemplo.com"
        />
      </div>
      }

      <div class="field">
        <label for="contraseña">Contraseña</label>
        <input
          id="contraseña"
          type="password"
          formControlName="contraseña"
          placeholder="••••••••"
        />
      </div>

      @if (error) {
      <p class="error">{{ error }}</p>
      }

      <button type="submit" [disabled]="loading || form.invalid">
        {{ loading ? 'Cargando...' : (modo === 'login' ? 'Ingresar' : 'Registrarse') }}
      </button>
    </form>

    <div class="divider">
      <span></span>
      <p>o</p>
      <span></span>
    </div>

    <button class="toggle" (click)="cambiarModo()">
      {{ modo === 'login' ? '¿No tenés cuenta? Registrate' : '¿Ya tenés cuenta? Ingresá' }}
    </button>
  </div>
</div>
